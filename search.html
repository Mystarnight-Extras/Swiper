<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10131b">
<title>Swiper JSON Search</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;background:#10131b;color:#f4f7ff;font-family:"Fredoka One",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#10131b;color:#f4f7ff;padding:clamp(18px,5vw,54px) 16px}
main{width:min(100%,760px);margin:0 auto}
textarea{display:block;width:100%;min-height:230px;resize:vertical;background:#171e2b;border:1px solid #354158;border-radius:14px;color:#fff;padding:15px;font:13px/1.6 ui-monospace,monospace;outline:none}
textarea:focus{border-color:#9eb8ed}
button{font:inherit;border:0;border-radius:12px;min-height:46px;padding:0 18px;background:#f4f7ff;color:#10131b;cursor:pointer}
button:disabled{opacity:.5;cursor:wait}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}
#status{min-height:28px;color:#aebbd0;font-size:13px;padding:10px 2px}
.result{margin-top:12px;padding:16px;background:#171e2b;border:1px solid #354158;border-radius:15px;overflow-wrap:anywhere}
.result h2{font-size:18px;margin:0 0 9px}
.meta{font-size:13px;color:#aebbd0;line-height:1.7}
.report{padding:15px 0;border-top:1px solid #354158}
.report-title{font-size:16px;line-height:1.5;margin-bottom:8px}
.report-line{font-size:13px;color:#b9c5d8;line-height:1.8}
.uuid{font:12px/1.6 ui-monospace,monospace;color:#c9f4e8;word-break:break-all}
.pill{display:inline-block;border:1px solid #52617a;border-radius:20px;padding:2px 9px;font-size:11px;color:#c9d6eb;margin:3px 4px 3px 0}
pre{white-space:pre-wrap;word-break:break-word;font:12px/1.5 ui-monospace,monospace;color:#d5deed;margin:8px 0 0}
.play-level{display:inline-flex;align-items:center;justify-content:center;margin-top:10px;min-height:42px;padding:0 15px;border-radius:11px;background:#c9f4e8;color:#092019;text-decoration:none;font-size:13px}.hidden{display:none!important}
</style>
</head>
<body>
<main>
<textarea id="jsonInput" spellcheck="false" autocomplete="off" aria-label="copied JSON" placeholder="Paste copied JSON here"></textarea>
<div class="actions">
<button id="scanButton" type="button">Search JSON</button>
<button id="copyButton" type="button" disabled>Copy results as JSON</button>
</div>
<div id="status" role="status" aria-live="polite">Paste copied JSON here. Reports will be translated into readable results.</div>
<section id="results" class="result hidden" aria-live="polite"></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(()=>{
"use strict"
const $=id=>document.getElementById(id)
const db=window.supabase.createClient("https://upghyzhawctughyojwpo.supabase.co","sb_publishable_z70GOIzu3F_xdxdJiVa48A_SqvrA6-b")
let records=[]
function node(tag,cls,value){const n=document.createElement(tag);if(cls)n.className=cls;if(value!==undefined)n.textContent=String(value);return n}
function parseMany(source){
 const values=[]
 let start=-1,depth=0,inString=false,escaped=false
 for(let i=0;i<source.length;i++){
  const c=source[i]
  if(start<0){
   if(c==="{"||c==="["){start=i;depth=1;inString=false;escaped=false}
   else if(!/\s|,/.test(c))throw new Error("Unexpected text at character "+(i+1))
   continue
  }
  if(inString){
   if(escaped)escaped=false
   else if(c==="\\")escaped=true
   else if(c==='"')inString=false
   continue
  }
  if(c==='"'){inString=true;continue}
  if(c==="{"||c==="[")depth++
  if(c==="}"||c==="]"){
   depth--
   if(depth===0){
    values.push(JSON.parse(source.slice(start,i+1)))
    start=-1
   }
   if(depth<0)throw new Error("JSON brackets do not match")
  }
 }
 if(start>=0)throw new Error("JSON looks incomplete. Copy the complete result and try again.")
 if(!values.length)throw new Error("No JSON object or array found.")
 return values.flatMap(value=>Array.isArray(value)?value:[value])
}
function typeName(type){
 const names={world:"community level",level:"community level",game:"game",score:"game score",player:"player",profile:"player",message:"message"}
 return names[String(type||"").toLowerCase()]||String(type||"item").replace(/_/g," ")
}
function addLine(card,label,value,uuid=false){
 if(value===null||value===undefined||value==="")return
 const line=node("div",uuid?"uuid":"report-line")
 line.textContent=label+": "+String(value)
 card.append(line)
}
function renderReport(row,index,data){
 const card=node("article","report")
 const kind=String(row.target_type||"").toLowerCase()
 const person=data.people.get(String(row.target_uuid||"").toLowerCase())
 const reporter=data.people.get(String(row.reporter_id||"").toLowerCase())
 const level=data.levels.get(String(row.target_uuid||"").toLowerCase())
 const score=data.scores.get(String(row.target_score_id||""))
 const who=reporter?(reporter.username||reporter.display_name):"Unknown player"
 let headline="A report was submitted about a "+typeName(kind)+"."
 if(kind==="player")headline=who+" reported player "+(person?(person.username||person.display_name):"Unknown player")+"."
 if(kind==="world"||kind==="level")headline=who+" reported "+(level?level.title:"Unknown community level")+" by "+(level?(data.people.get(String(level.user_id||"").toLowerCase())?.username||level.creator_name||"Unknown creator"):"Unknown creator")+"."
 if(kind==="score")headline=who+" reported a score"+(score?" by "+score.player_name:"")+"."
 card.append(node("div","report-title",headline))
 if(!reporter)addLine(card,"Reporter ID",row.reporter_id,true)
 if(kind==="player"&&!person)addLine(card,"Player ID",row.target_uuid,true)
 if(kind==="world"||kind==="level"){
  if(!level)addLine(card,"Community level ID",row.target_uuid,true)
  if(level){addLine(card,"Level difficulty",level.difficulty);addLine(card,"Level created",new Date(level.created_at).toLocaleString())}
 }
 if(kind==="score"){
  if(score){addLine(card,"Player",score.player_name);addLine(card,"Score",score.score);addLine(card,"Mode",score.mode);if(score.difficulty)addLine(card,"Difficulty",score.difficulty);addLine(card,"Score submitted",new Date(score.created_at).toLocaleString())}
  else addLine(card,"Score ID",row.target_score_id||row.target_uuid,true)
 }
 addLine(card,"Reason",row.reason||"No reason provided")
 if(row.details)addLine(card,"Additional details",row.details)
 if(row.created_at){const d=new Date(row.created_at);addLine(card,"Reported at",Number.isNaN(d.getTime())?row.created_at:d.toLocaleString())}
 if(row.status)addLine(card,"Report status",row.status)
 if(row.target_score_id&&kind!=="score")addLine(card,"Related score ID",row.target_score_id,true)
 addLine(card,"Report ID",row.id,true)
 if((kind==="world"||kind==="level")&&/^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(String(row.target_uuid||""))){
  const play=document.createElement("a")
  play.className="play-level"
  play.href="./?playLevel="+encodeURIComponent(row.target_uuid)
  play.textContent="Open and play community level"
  card.append(play)
 }
 return card
}
async function lookupReports(reports){
 const personIds=[...new Set(reports.flatMap(row=>[row.reporter_id,row.target_type==="player"?row.target_uuid:null]).filter(Boolean))]
 const levelIds=[...new Set(reports.filter(row=>["world","level"].includes(String(row.target_type||"").toLowerCase())).map(row=>row.target_uuid).filter(Boolean))]
 const scoreIds=[...new Set(reports.map(row=>row.target_score_id).filter(Boolean).map(String))]
 const [peopleResult,levelResult,scoreResult]=await Promise.all([
  personIds.length?db.from("swipe_public_directory").select("id,username,display_name").in("id",personIds):Promise.resolve({data:[],error:null}),
  levelIds.length?db.from("swiper_levels").select("id,title,creator_name,user_id,difficulty,created_at").in("id",levelIds):Promise.resolve({data:[],error:null}),
  scoreIds.length?db.from("swipe_scores").select("id,player_name,score,mode,difficulty,created_at,user_id").in("id",scoreIds):Promise.resolve({data:[],error:null})
 ])
 const people=new Map((peopleResult.data||[]).map(x=>[String(x.id).toLowerCase(),x]))
 const levels=new Map((levelResult.data||[]).map(x=>[String(x.id).toLowerCase(),x]))
 const creatorIds=[...new Set((levelResult.data||[]).map(x=>x.user_id).filter(Boolean))]
 if(creatorIds.length){
  const creators=await db.from("swipe_public_directory").select("id,username,display_name").in("id",creatorIds)
  for(const x of creators.data||[])people.set(String(x.id).toLowerCase(),x)
 }
 return {people,levels,scores:new Map((scoreResult.data||[]).map(x=>[String(x.id),x])),errors:[peopleResult.error,levelResult.error,scoreResult.error].filter(Boolean)}
}
async function render(){
 const source=$("jsonInput").value.trim()
 const box=$("results")
 box.replaceChildren()
 box.classList.add("hidden")
 $("copyButton").disabled=true
 records=[]
 if(!source){$("status").textContent="Paste JSON first.";return}
 try{records=parseMany(source)}catch(error){$("status").textContent=error.message;return}
 const reports=records.filter(row=>row&&typeof row==="object"&&!Array.isArray(row)&&("target_type" in row||"reporter_id" in row)&&("reason" in row||"target_uuid" in row))
 box.append(node("h2","",reports.length?"Found "+reports.length+" report"+(reports.length===1?"":"s"):"Found "+records.length+" JSON record"+(records.length===1?"":"s")))
 if(reports.length){
  $("scanButton").disabled=true
  $("status").textContent="Resolving players, levels and scores…"
  try{const data=await lookupReports(reports);reports.forEach((row,index)=>box.append(renderReport(row,index,data)));if(data.errors.length)box.append(node("div","meta","Some public details could not be loaded from Supabase."))}
  catch(error){box.append(node("div","meta","Lookup failed: "+error.message))}
  finally{$("scanButton").disabled=false}
 }else{
  box.append(node("div","meta","JSON was read successfully, but these records do not look like Swiper reports. Raw records are shown below."))
  records.forEach((row,index)=>{
   const section=node("div","report")
   section.append(node("div","report-title","Record "+(index+1)))
   section.append(node("pre","",JSON.stringify(row,null,2)))
   box.append(section)
  })
 }
 box.classList.remove("hidden")
 $("status").textContent="Finished. Read "+records.length+" record"+(records.length===1?"":"s")+" and identified "+reports.length+" report"+(reports.length===1?"":"s")+"."
 $("copyButton").disabled=false
}
$("scanButton").addEventListener("click",render)
$("copyButton").addEventListener("click",async()=>{
 if(!records.length)return
 try{await navigator.clipboard.writeText(JSON.stringify(records,null,2));$("status").textContent="Parsed JSON records copied."}
 catch(error){$("status").textContent="Clipboard access was blocked. You can still select and copy the original JSON."}
})
})()
</script>
</body>
</html>
