<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10131b">
<title>Swiper JSON Search</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;background:#10131b;color:#f4f7ff;font-family:"Fredoka One",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#10131b;color:#f4f7ff;padding:clamp(18px,5vw,54px) 16px}
main{width:min(100%,760px);margin:0 auto}
textarea{display:block;width:100%;min-height:230px;resize:vertical;background:#171e2b;border:1px solid #354158;border-radius:14px;color:#fff;padding:15px;font:13px/1.6 ui-monospace,monospace;outline:none}
textarea:focus{border-color:#9eb8ed}
button{font:inherit;border:0;border-radius:12px;min-height:46px;padding:0 18px;background:#f4f7ff;color:#10131b;cursor:pointer}
button:disabled{opacity:.5;cursor:wait}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}
#status{min-height:28px;color:#aebbd0;font-size:13px;padding:10px 2px}
.result{margin-top:12px;padding:16px;background:#171e2b;border:1px solid #354158;border-radius:15px;overflow-wrap:anywhere}
.result h2{font-size:18px;margin:0 0 9px}
.meta{font-size:13px;color:#aebbd0;line-height:1.7}
.item{padding:13px 0;border-top:1px solid #354158}
.uuid{font:12px/1.5 ui-monospace,monospace;color:#c9f4e8;word-break:break-all}
pre{white-space:pre-wrap;word-break:break-word;font:12px/1.5 ui-monospace,monospace;color:#d5deed;margin:8px 0 0}
.hidden{display:none!important}
</style>
</head>
<body>
<main>
<textarea id="jsonInput" spellcheck="false" autocomplete="off" aria-label="Supabase JSON" placeholder="Paste copied Supabase JSON here"></textarea>
<div class="actions">
<button id="scanButton" type="button">Find IDs and data</button>
<button id="copyButton" type="button" disabled>Copy results as JSON</button>
</div>
<div id="status" role="status" aria-live="polite">Paste JSON copied from Supabase, then scan it. This tool only reads the text you paste.</div>
<section id="results" class="result hidden" aria-live="polite"></section>
</main>
<script>
(()=>{
"use strict"
const $=id=>document.getElementById(id)
const uuidPattern=/\b[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}\b/ig
let found=[]
function node(tag,cls,value){const n=document.createElement(tag);if(cls)n.className=cls;if(value!==undefined)n.textContent=String(value);return n}
function scan(value){
 const matches=new Map()
 function visit(item,path,parent){
  if(typeof item==="string"){
   const ids=item.match(uuidPattern)||[]
   ids.forEach(id=>{
    const key=id.toLowerCase()
    if(!matches.has(key))matches.set(key,{id:key,paths:[],records:[]})
    const entry=matches.get(key)
    if(!entry.paths.includes(path))entry.paths.push(path)
    if(parent&&typeof parent==="object"&&!entry.records.includes(parent))entry.records.push(parent)
   })
   return
  }
  if(Array.isArray(item)){
   item.forEach((child,index)=>visit(child,path+"["+index+"]",child&&typeof child==="object"?child:item))
   return
  }
  if(item&&typeof item==="object"){
   Object.entries(item).forEach(([key,child])=>visit(child,path?path+"."+key:key,item))
  }
 }
 visit(value,"$",value)
 return [...matches.values()]
}
function render(){
 const input=$("jsonInput").value.trim()
 $("results").replaceChildren()
 $("results").classList.add("hidden")
 $("copyButton").disabled=true
 found=[]
 if(!input){$("status").textContent="Paste Supabase JSON first.";return}
 let parsed
 try{parsed=JSON.parse(input)}catch(error){$("status").textContent="That is not valid JSON. Copy the JSON response from Supabase and paste it here.";return}
 found=scan(parsed)
 if(!found.length){$("status").textContent="Valid JSON. No UUIDs were found.";return}
 const box=$("results")
 box.append(node("h2","","Found "+found.length+" unique UUID"+(found.length===1?"":"s")))
 box.append(node("div","meta","Each result includes the JSON location and the record containing the ID."))
 found.forEach((entry,index)=>{
  const card=node("div","item")
  card.append(node("div","uuid",entry.id))
  entry.paths.forEach(path=>card.append(node("div","meta","Found at "+path)))
  const record=entry.records.find(x=>x&&typeof x==="object")
  if(record){
   const pre=node("pre","",JSON.stringify(record,null,2))
   card.append(pre)
  }
  box.append(card)
 })
 box.classList.remove("hidden")
 $("status").textContent="Scan complete. "+found.length+" UUIDs found."
 $("copyButton").disabled=false
}
$("scanButton").addEventListener("click",render)
$("copyButton").addEventListener("click",async()=>{
 if(!found.length)return
 const output=found.map(entry=>({id:entry.id,paths:entry.paths,records:entry.records}))
 try{await navigator.clipboard.writeText(JSON.stringify(output,null,2));$("status").textContent="Found IDs and matching data copied as JSON."}
 catch(error){$("status").textContent="Clipboard access was blocked. Select and copy the results manually."}
})
})()
</script>
</body>
</html>
